name: Lonely Runner Lean kernel check

on:
  push:
    branches: ["lonely-runner-lean-check"]
    paths:
      - "lonely-runner-lean/**"
      - ".github/workflows/lonely-runner-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders
        shell: bash
        run: |
          if grep -R --include='*.lean' -nE '\b(sorry|admit)\b' lonely-runner-lean; then
            echo "Proof placeholder found"
            exit 1
          fi
      - name: Install pinned Lean and generate Lake manifest
        shell: bash
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd lonely-runner-lean
          lake update
      - name: Build and independently kernel-check
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lonely-runner-lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: LonelyRunner
          use-mathlib-cache: true
